<aside *ngIf="guidance() as tip" class="assistant" [class.expanded]="expanded()" aria-label="Assistente de configuração Atenclin"
  (pointerenter)="onPointerEnter($event)" (pointerleave)="onPointerLeave()" (focusin)="onFocusIn()" (focusout)="onFocusOut($event)"
  (keydown.escape)="expanded.set(false)">
  <section *ngIf="expanded()" id="wizard-assistant-message" class="bubble" aria-live="polite">
    <button type="button" class="close" aria-label="Recolher dicas de configuração" (click)="expanded.set(false)">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
    <span class="eyebrow">ASSISTENTE ATENCLIN</span>
    <h2>{{ tip.title }}</h2>
    <p>{{ tip.text }}</p>
    <a class="guide" [href]="'ajuda-docs/artigos/' + tip.guide" target="_blank" rel="noopener noreferrer">
      Ver guia de configuração <i class="pi pi-external-link" aria-hidden="true"></i>
      <span class="sr-only"> (abre em outra aba)</span>
    </a>
  </section>
  <div class="avatar-row">
    <button type="button" class="avatar" (click)="expanded.set(true)" [attr.aria-controls]="expanded() ? 'wizard-assistant-message' : null" [attr.aria-expanded]="expanded()" aria-label="Mostrar dicas de configuração Atenclin">
      <img src="logo.png" alt="Atenclin" width="64" height="64">
      <span class="badge" aria-hidden="true"><i class="pi pi-question"></i></span>
    </button>
  </div>
</aside>
